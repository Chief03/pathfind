version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm ci --include=optional
    build:
      commands:
        # Deploy backend and generate outputs
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        - npx ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH
        # Verify outputs were generated
        - test -f amplify_outputs.json || (echo "ERROR: amplify_outputs.json not generated" && exit 1)
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=optional
        - npm list @parcel/watcher || npm install @parcel/watcher --save-optional
    build:
      commands:
        - echo "Checking for amplify_outputs.json..."
        - test -f amplify_outputs.json || (echo "ERROR: amplify_outputs.json not found" && exit 1)
        - echo "Building Next.js application..."
        - npm run build:prod || npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*