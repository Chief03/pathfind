version: 1
backend:
  phases:
    preBuild:
      commands:
        - npm ci --include=optional
    build:
      commands:
        - npx ampx generate outputs --app-id $AWS_APP_ID --branch $AWS_BRANCH || echo "Backend generation skipped"
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --include=optional
        - npm list @parcel/watcher || npm install @parcel/watcher --save-optional
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*